[package]
name = "codex-micro"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Device library for the Work Louder Codex Micro"
repository = "https://github.com/gjermundgaraba/herdr-plugins"
publish = false

[dependencies]
anyhow.workspace = true
base64 = "0.23.0"
libc.workspace = true
objc2-core-foundation = { workspace = true, features = ["CFDate", "CFDictionary", "CFNumber", "CFRunLoop", "CFString"] }
objc2-io-kit = { version = "0.3.2", default-features = false, features = ["AppleUSBDefinitions", "IOUSBHostFamilyDefinitions", "IOUSBLib", "USB", "USBSpec", "libc", "objc2", "std", "usb"] }
serde.workspace = true
serde_json.workspace = true
