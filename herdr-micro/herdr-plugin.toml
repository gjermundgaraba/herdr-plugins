id = "gjermundgaraba.herdr-micro"
name = "Herdr Micro"
version = "0.1.0"
min_herdr_version = "0.7.5"
description = "Control Herdr from a Work Louder Codex Micro."
platforms = ["macos"]

[[build]]
command = ["cargo", "build", "--release", "--locked"]

[[build]]
command = ["mkdir", "-p", "bin"]

[[build]]
command = ["install", "-m", "750", "../target/release/herdr-micro", "bin/.herdr-micro.new"]

[[build]]
command = ["mv", "-f", "bin/.herdr-micro.new", "bin/herdr-micro"]

[[build]]
command = ["install", "-m", "750", "../target/release/herdr-micro-hid", "bin/.herdr-micro-hid.new"]

[[build]]
command = ["mv", "-f", "bin/.herdr-micro-hid.new", "bin/herdr-micro-hid"]

[[startup]]
command = ["bin/herdr-micro", "start"]

[[panes]]
id = "diff"
title = "diff"
placement = "popup"
width = "95%"
height = "90%"
command = ["hunk", "diff", "--watch"]

[[actions]]
id = "status"
title = "Show Herdr status"
command = ["bin/herdr-micro", "herdr-status"]

[[actions]]
id = "doctor"
title = "Check Herdr Micro setup"
command = ["bin/herdr-micro", "doctor"]

[[actions]]
id = "effort-raise"
title = "Raise focused agent effort"
command = ["bin/herdr-micro", "effort", "raise"]

[[actions]]
id = "effort-lower"
title = "Lower focused agent effort"
command = ["bin/herdr-micro", "effort", "lower"]

[[actions]]
id = "micro-start"
title = "Start Micro bridge"
command = ["bin/herdr-micro", "start"]

[[actions]]
id = "micro-status"
title = "Show Micro bridge status"
command = ["bin/herdr-micro", "status"]

[[actions]]
id = "micro-configure-controls"
title = "Configure Micro controls"
command = ["bin/herdr-micro", "configure-controls"]

[[actions]]
id = "setup-pi-effort"
title = "Install Pi effort controls"
command = ["bin/herdr-micro", "setup-pi-effort"]

[[actions]]
id = "micro-stop"
title = "Stop Micro bridge"
command = ["bin/herdr-micro", "stop"]

[[actions]]
id = "micro-setup"
title = "Set up Micro Layer 2"
command = ["bin/herdr-micro", "setup"]
