id = "gjermundgaraba.herdr-micro"
name = "Herdr Micro"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Control Herdr from a Work Louder Codex Micro."
platforms = ["macos"]

[[build]]
command = ["cargo", "build", "--release", "--locked", "--package", "herdr-micro", "--bin", "herdr-micro", "--package", "codex-micro", "--bin", "codex-micro"]

[[build]]
command = ["mkdir", "-p", "bin"]

# Stage both binaries and sign the service before either rename, so a signing
# failure leaves the live pair untouched and the live path never holds an
# unsigned binary.
[[build]]
command = ["install", "-m", "750", "../target/release/herdr-micro", "bin/.herdr-micro.new"]

[[build]]
command = ["install", "-m", "750", "../target/release/codex-micro", "bin/.codex-micro.new"]

[[build]]
command = ["/usr/bin/codesign", "--force", "--timestamp=none", "--sign", "Apple Development", "--identifier", "dev.herdr.codex-micro", "bin/.codex-micro.new"]

[[build]]
command = ["mv", "-f", "bin/.herdr-micro.new", "bin/herdr-micro"]

[[build]]
command = ["mv", "-f", "bin/.codex-micro.new", "bin/codex-micro"]

[[startup]]
command = ["bin/herdr-micro", "start"]

[[panes]]
id = "diff"
title = "diff"
placement = "popup"
width = "95%"
height = "90%"
command = ["hunk", "diff", "--watch"]

[[actions]]
id = "doctor"
title = "Check Herdr Micro setup"
command = ["bin/herdr-micro", "doctor"]

[[actions]]
id = "service-authorize"
title = "Authorize Codex Micro input access"
command = ["bin/codex-micro", "authorize"]

[[actions]]
id = "micro-start"
title = "Start Micro bridge"
command = ["bin/herdr-micro", "start"]

[[actions]]
id = "micro-status"
title = "Show Micro bridge status"
command = ["bin/herdr-micro", "status"]

[[actions]]
id = "micro-configure"
title = "Configure Herdr Micro"
command = ["bin/herdr-micro", "configure"]

[[actions]]
id = "setup-pi-effort"
title = "Install Pi effort controls"
command = ["bin/herdr-micro", "setup-pi-effort"]

[[actions]]
id = "micro-stop"
title = "Stop Micro bridge"
command = ["bin/herdr-micro", "stop"]

[[actions]]
id = "micro-setup"
title = "Set up Micro Layer 2"
command = ["bin/herdr-micro", "setup"]
