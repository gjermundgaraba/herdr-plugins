[package]
name = "herdr-micro"
version = "0.8.0"
edition = "2021"
rust-version = "1.71"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.0"
libc = "0.2.183"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSRunningApplication", "NSWorkspace", "libc"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["CFArray", "CFDictionary", "CFNumber", "CFRunLoop", "CFSet", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGError", "CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation", "CGWindow"] }
objc2-io-kit = { version = "0.3.2", default-features = false, features = ["hid", "objc2", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.4.4"
