[package]
name = "herdr-micro"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Control Herdr from a Work Louder Codex Micro"
repository = "https://github.com/gjermundgaraba/herdr-plugins"

[dependencies]
anyhow.workspace = true
codex-micro = { path = "codex-micro" }
herdr-client.workspace = true
libc.workspace = true
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSRunningApplication", "NSWorkspace", "libc"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString"] }
objc2-core-foundation = { workspace = true, features = ["CFArray", "CFDictionary", "CFNumber", "CFRunLoop", "CFSet", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGDirectDisplay", "CGError", "CGEvent", "CGEventSource", "CGEventTypes", "CGGeometry", "CGRemoteOperation", "CGWindow"] }
serde.workspace = true
serde_json.workspace = true
signal-hook = "0.4.4"
