[workspace]
resolver = "3"
members = [
    "herdr-picker",
    "herdr-picker-agents",
    "herdr-picker-workspaces",
    "equalize-splits",
    "fork-to-pane",
    "herdr-micro",
    "herdr-micro/codex-micro",
    "history",
    "sdk/picker",
    "sdk/ratatui",
    "sdk/rust",
]

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/gjermundgaraba/herdr-plugins"

[workspace.dependencies]
anyhow = "1.0.104"
herdr-client = { path = "sdk/rust" }
herdr-picker-sdk = { path = "sdk/picker" }
herdr-ratatui = { path = "sdk/ratatui" }
libc = "0.2.189"
objc2-core-foundation = { version = "0.3.2", default-features = false }
ratatui = { version = "0.30.2", default-features = false }
ratatui-core = "0.1.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = { version = "1.1.4", default-features = false, features = ["parse", "serde"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
