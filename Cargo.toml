[workspace]
resolver = "3"
members = [
    "command-palette",
    "equalize-splits",
    "herdr-micro",
    "herdr-micro/codex-micro",
    "history",
    "popup-terminal",
    "sdk/rust",
]

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.104"
herdr-client = { path = "sdk/rust" }
libc = "0.2.183"
objc2-core-foundation = { version = "0.3.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = { version = "0.8", default-features = false, features = ["parse"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
