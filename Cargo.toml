[workspace]
resolver = "3"
members = [
    "herdr-hub",
    "herdr-picker",
    "equalize-splits",
    "fork-to-pane",
    "herdr-micro",
    "codex-micro",
    "space-meta",
    "sdk/hub",
    "sdk/ratatui",
    "sdk/rust",
]

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/gjermundgaraba/herdr-plugins"

[workspace.dependencies]
anyhow = "1.0.104"
herdr-client = { path = "sdk/rust" }
herdr-hub-client = { path = "sdk/hub" }
herdr-ratatui = { path = "sdk/ratatui" }
libc = "0.2.189"
objc2-core-foundation = { version = "0.3.2", default-features = false }
ratatui = { version = "0.30.2", default-features = false }
ratatui-core = "0.1.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.20"
toml = { version = "1.1.4", default-features = false, features = ["parse", "serde"] }

[profile.release]
strip = true
