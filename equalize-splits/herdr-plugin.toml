id = "gjermundgaraba.herdr-equalize-splits"
name = "Equalize Splits"
version = "0.4.0"
min_herdr_version = "0.8.0"
description = "Automatically equalize pane sizes after splits and closes"
platforms = ["macos", "linux"]

[[build]]
command = ["cargo", "build", "--release", "--locked", "-p", "herdr-equalize-splits"]

[[build]]
command = ["mkdir", "-p", "bin"]

[[build]]
command = ["install", "-m", "750", "../target/release/herdr-equalize-splits", "bin/.herdr-equalize-splits.new"]

[[build]]
command = ["mv", "-f", "bin/.herdr-equalize-splits.new", "bin/herdr-equalize-splits"]

[[startup]]
command = ["bin/herdr-equalize-splits"]

[[events]]
on = "pane.created"
command = ["bin/herdr-equalize-splits"]

[[events]]
on = "pane.moved"
command = ["bin/herdr-equalize-splits"]

[[events]]
on = "pane.closed"
command = ["bin/herdr-equalize-splits"]

[[events]]
on = "pane.exited"
command = ["bin/herdr-equalize-splits"]
