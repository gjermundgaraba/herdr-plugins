id = "gjermundgaraba.herdr-equalize-splits"
name = "Equalize Splits"
version = "0.3.0"
min_herdr_version = "0.8.0"
description = "Automatically equalize pane sizes after splits and closes"
platforms = ["macos", "linux"]

[[build]]
command = ["cargo", "build", "--release", "--locked"]

[[startup]]
command = ["../target/release/herdr-equalize-splits"]

[[events]]
on = "pane.created"
command = ["../target/release/herdr-equalize-splits"]

[[events]]
on = "pane.moved"
command = ["../target/release/herdr-equalize-splits"]

[[events]]
on = "pane.closed"
command = ["../target/release/herdr-equalize-splits"]

[[events]]
on = "pane.exited"
command = ["../target/release/herdr-equalize-splits"]
