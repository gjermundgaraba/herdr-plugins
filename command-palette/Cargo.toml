[package]
name = "herdr-command-palette"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Fuzzy command and navigation palette for Herdr"

[dependencies]
crossterm = "0.29"
herdr-client = { path = "../sdk/rust" }
libc = "0.2"
nucleo-matcher = "0.3"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
unicode-truncate = "2"
unicode-width = "0.2"

[profile.release]
lto = true
strip = true
