id = "gjermundgaraba.herdr-command-palette"
name = "command-palette"
version = "0.2.0"
min_herdr_version = "0.7.5"
description = "Fuzzy command and navigation palette with effective Herdr keybindings"
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release", "--locked"]

[[actions]]
id = "open"
title = "Command palette"
description = "Search actions, workspaces, tabs, panes, and agents"
command = ["../target/release/herdr-command-palette"]

[[actions]]
id = "agents"
title = "Agents"
description = "Attention-ranked agent palette"
command = ["../target/release/herdr-command-palette"]

[[actions]]
id = "workspaces"
title = "Workspaces"
description = "Workspace palette"
command = ["../target/release/herdr-command-palette"]

[[panes]]
id = "palette"
title = "command palette"
placement = "popup"
width = "88%"
height = "80%"
command = ["../target/release/herdr-command-palette"]
