id = "gjermundgaraba.herdr-space-meta"
name = "Space Meta"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Space numbers and PR badges in the spaces sidebar"
platforms = ["macos", "linux"]

[[build]]
command = ["cargo", "build", "--release", "--locked"]

[[startup]]
command = ["../target/release/herdr-space-meta"]

[[actions]]
id = "refresh"
title = "Refresh space numbers and PR badges"
command = ["../target/release/herdr-space-meta"]

[[events]]
on = "workspace.created"
command = ["../target/release/herdr-space-meta"]

[[events]]
on = "workspace.updated"
command = ["../target/release/herdr-space-meta"]

[[events]]
on = "workspace.renamed"
command = ["../target/release/herdr-space-meta"]

[[events]]
on = "workspace.closed"
command = ["../target/release/herdr-space-meta"]

[[events]]
on = "workspace.moved"
command = ["../target/release/herdr-space-meta"]

[[events]]
on = "workspace.reordered"
command = ["../target/release/herdr-space-meta"]

[[events]]
on = "workspace.focused"
command = ["../target/release/herdr-space-meta"]

[[events]]
on = "worktree.created"
command = ["../target/release/herdr-space-meta"]

[[events]]
on = "worktree.opened"
command = ["../target/release/herdr-space-meta"]

[[events]]
on = "worktree.removed"
command = ["../target/release/herdr-space-meta"]
