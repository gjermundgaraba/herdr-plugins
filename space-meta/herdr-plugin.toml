id = "gjermundgaraba.herdr-space-meta"
name = "Space Meta"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Space numbers and PR badges in the spaces sidebar"
platforms = ["macos", "linux"]

[[build]]
command = ["cargo", "build", "--release", "--locked", "-p", "herdr-space-meta"]

[[build]]
command = ["mkdir", "-p", "bin"]

[[build]]
command = ["install", "-m", "750", "../target/release/herdr-space-meta", "bin/.herdr-space-meta.new"]

[[build]]
command = ["mv", "-f", "bin/.herdr-space-meta.new", "bin/herdr-space-meta"]

[[startup]]
command = ["bin/herdr-space-meta"]

[[actions]]
id = "refresh"
title = "Refresh space numbers and PR badges"
command = ["bin/herdr-space-meta"]

[[events]]
on = "workspace.created"
command = ["bin/herdr-space-meta"]

[[events]]
on = "workspace.updated"
command = ["bin/herdr-space-meta"]

[[events]]
on = "workspace.renamed"
command = ["bin/herdr-space-meta"]

[[events]]
on = "workspace.closed"
command = ["bin/herdr-space-meta"]

[[events]]
on = "workspace.moved"
command = ["bin/herdr-space-meta"]

[[events]]
on = "workspace.reordered"
command = ["bin/herdr-space-meta"]

[[events]]
on = "workspace.focused"
command = ["bin/herdr-space-meta"]

[[events]]
on = "worktree.created"
command = ["bin/herdr-space-meta"]

[[events]]
on = "worktree.opened"
command = ["bin/herdr-space-meta"]

[[events]]
on = "worktree.removed"
command = ["bin/herdr-space-meta"]
