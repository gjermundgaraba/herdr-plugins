id = "gjermundgaraba.herdr-space-meta"
name = "Space Meta"
version = "0.2.0"
min_herdr_version = "0.8.0"
description = "Adds space numbers, branch names, git-dirty markers, and PR badges to the spaces sidebar. Needs git; PR badges also need gh"
platforms = ["macos"]

[[build]]
command = ["cargo", "build", "--release", "--locked", "-p", "herdr-space-meta"]

[[build]]
command = ["mkdir", "-p", "bin"]

[[build]]
command = ["install", "-m", "750", "../target/release/herdr-space-meta", "bin/.herdr-space-meta.new"]

[[build]]
command = ["mv", "-f", "bin/.herdr-space-meta.new", "bin/herdr-space-meta"]

[[startup]]
command = ["bin/herdr-space-meta"]

[[actions]]
id = "refresh"
title = "Restart the space-meta daemon and republish all tokens"
command = ["bin/herdr-space-meta"]
