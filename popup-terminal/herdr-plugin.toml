id = "gjermundgaraba.herdr-popup-terminal"
name = "Popup Terminal"
version = "0.2.0"
min_herdr_version = "0.7.4"
description = "Open a native popup shell in the focused pane's working directory"
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release", "--locked"]

[[actions]]
id = "open"
title = "Open popup terminal"
description = "Open a shell in the focused pane's working directory"
contexts = ["pane"]
command = ["sh", "-c", "exec \"$HERDR_BIN_PATH\" plugin pane open --plugin gjermundgaraba.herdr-popup-terminal --entrypoint terminal"]

[[panes]]
id = "terminal"
title = "terminal"
placement = "popup"
command = ["../target/release/herdr-popup-terminal"]
