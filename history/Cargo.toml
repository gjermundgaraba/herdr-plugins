[package]
name = "herdr-history"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "Vim-style pane focus history for Herdr"

[dependencies]
herdr-client = { path = "../sdk/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
