id = "gjermundgaraba.herdr-history"
name = "Herdr History"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Vim-style back/forward focus history across panes, tabs, and workspaces"
platforms = ["macos", "linux"]

[[build]]
command = ["cargo", "build", "--release", "--locked"]

[[events]]
on = "pane.focused"
command = ["../target/release/herdr-history"]

[[actions]]
id = "back"
title = "History back"
description = "Jump to the previously focused pane (vim ctrl+o)"
command = ["../target/release/herdr-history"]

[[actions]]
id = "forward"
title = "History forward"
description = "Jump forward in focus history (vim ctrl+i)"
command = ["../target/release/herdr-history"]
