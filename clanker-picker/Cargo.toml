[package]
name = "herdr-clanker-picker"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
description = "Agent inbox for herdr: every agent in the session, attention-ranked"

[dependencies]
herdr-client = { path = "../sdk/rust" }
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
unicode-width = "0.2"

[profile.release]
lto = true
strip = true
