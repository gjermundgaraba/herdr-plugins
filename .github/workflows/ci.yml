name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy, rustfmt
      - run: cargo +1.89.0 fmt --all -- --check
      - run: cargo +1.89.0 clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo +1.89.0 test --workspace --all-features --locked
