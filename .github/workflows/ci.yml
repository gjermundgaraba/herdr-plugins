name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  macos:
    name: macOS workspace (${{ matrix.toolchain }})
    runs-on: macos-14
    strategy:
      matrix:
        toolchain: [1.89.0, 1.96.1]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - run: cargo +${{ matrix.toolchain }} fmt --all -- --check
      - run: cargo +${{ matrix.toolchain }} clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +${{ matrix.toolchain }} test --workspace --locked

  linux:
    name: Linux plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.89.0
          components: clippy
      - run: >-
          cargo +1.89.0 clippy --workspace --all-targets --locked
          --exclude herdr-micro
          --exclude codex-micro
          -- -D warnings
      - run: >-
          cargo +1.89.0 test --workspace --locked
          --exclude herdr-micro
          --exclude codex-micro

  windows:
    name: Windows client
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.89.0
          components: clippy
      - run: cargo +1.89.0 clippy --all-targets --locked -p herdr-client -- -D warnings
      - run: cargo +1.89.0 test --locked -p herdr-client
