name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  macos:
    name: macOS workspace
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy, rustfmt
      - run: cargo +1.89.0 fmt --all -- --check
      - run: cargo +1.89.0 clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo +1.89.0 test --workspace --all-features --locked

  linux:
    name: Linux plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy
      - run: >-
          cargo +1.89.0 clippy --all-targets --all-features --locked
          -p herdr-client
          -p herdr-ratatui
          -p herdr-command-palette
          -p herdr-equalize-splits
          -p herdr-history
          -p herdr-popup-terminal
          -- -D warnings
      - run: >-
          cargo +1.89.0 test --all-features --locked
          -p herdr-client
          -p herdr-ratatui
          -p herdr-command-palette
          -p herdr-equalize-splits
          -p herdr-history
          -p herdr-popup-terminal

  windows:
    name: Windows client
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy
      - run: cargo +1.89.0 clippy --all-targets --all-features --locked -p herdr-client -- -D warnings
      - run: cargo +1.89.0 test --all-features --locked -p herdr-client
