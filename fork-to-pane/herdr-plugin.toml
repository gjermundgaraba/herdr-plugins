id = "gjermundgaraba.herdr-fork-to-pane"
name = "Fork to Pane"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Fork the focused Pi, Codex, Claude Code, or OpenCode session into a new pane. Amp gets a branch with a thread reference instead. Needs each agent's Herdr integration and a keybinding"
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release", "--locked", "-p", "herdr-fork-to-pane"]

[[build]]
command = ["mkdir", "-p", "bin"]

[[build]]
command = ["install", "-m", "750", "../target/release/herdr-fork-to-pane", "bin/.herdr-fork-to-pane.new"]

[[build]]
command = ["mv", "-f", "bin/.herdr-fork-to-pane.new", "bin/herdr-fork-to-pane"]

[[actions]]
id = "fork"
title = "Fork agent into right pane"
description = "Fork Pi, Codex, Claude Code, or OpenCode; for Amp use its Herdr: Branch into right pane command"
contexts = ["pane"]
command = ["bin/herdr-fork-to-pane"]
